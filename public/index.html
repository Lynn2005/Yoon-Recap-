<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yoon Recap Studio</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="wrap">
<header><div class="logo">YR</div><div><h1>Yoon Recap</h1><p>AI Movie Recap Studio</p></div></header>
<section class="card key"><label>Gemini API Key</label><div class="keyrow"><input id="key" type="password" placeholder="AIza..."><button id="saveKey" type="button">💾 Save Key</button><a href="https://aistudio.google.com/app/apikey" target="_blank">Get Key</a></div><small id="keyStatus">Key ကို ဒီဖုန်းရဲ့ browser ထဲမှာသာ သိမ်းထားပါမယ်။</small></section>
<section class="card"><div class="badge">STEP 01</div><h2>🎬 Video Upload</h2><p>Movie / story video ကိုရွေးပါ။</p><input id="video" type="file" accept="video/*"><video id="preview" controls playsinline hidden></video><button id="transcribe">🎙 Auto Transcript</button><div id="tstatus" class="status"></div></section>
<section class="card"><div class="badge">STEP 02</div><h2>📝 Transcript</h2><textarea id="transcript" placeholder="Transcript will appear here..."></textarea><div class="grid"><button id="copyTranscript">Copy</button><button id="downloadTxt">Download TXT</button></div></section>
<section class="card"><div class="badge">STEP 03</div><h2>🤖 Myanmar Movie Recap</h2><select id="style"><option value="cinematic">Cinematic</option><option value="casual">Casual Myanmar</option><option value="dramatic">Dramatic</option><option value="funny">Funny</option></select><button id="recap">✨ Generate Myanmar Recap</button><input id="title" placeholder="Recap title"><textarea id="hook" class="short" placeholder="Hook"></textarea><textarea id="summary" class="short" placeholder="Summary"></textarea><textarea id="script" placeholder="Myanmar recap script..."></textarea><div class="grid"><button id="copyScript">Copy Script</button><button id="downloadScript">Download Script</button></div><div id="rstatus" class="status"></div></section>
<section class="card"><div class="badge">STEP 04</div><h2>📱 TikTok Caption</h2><textarea id="caption" placeholder="Caption + hashtags"></textarea><button id="makeCaption">✨ Make Caption</button><button id="copyCaption">Copy Caption</button></section>
<footer>Yoon Recap 2.0 • Upload → Transcript → Myanmar Recap</footer>
</main><script src="/app.js"></script></body></html>
