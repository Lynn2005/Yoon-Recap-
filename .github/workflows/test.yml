name: Yoon Recap tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run server integration test
        run: npm test
